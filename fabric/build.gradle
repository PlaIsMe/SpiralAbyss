plugins { id 'com.gradleup.shadow' }
architectury { platformSetupLoomIde(); fabric() }
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}
dependencies {
    modCompileOnly 'com.terraformersmc:modmenu:11.0.3'
    modCompileOnly 'maven.modrinth:geckolib:tmxM7U4W'
    // Architectury's development transformer resolves the optional preview hierarchy.
    modLocalRuntime 'maven.modrinth:geckolib:tmxM7U4W'

    implementation 'com.electronwill.night-config:core:3.8.0'
    implementation 'com.electronwill.night-config:toml:3.8.0'
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    modImplementation 'maven.modrinth:forge-config-api-port:N5qzq0XV'
    include 'io.github.llamalad7:mixinextras-fabric:0.5.0'
    modImplementation 'io.github.llamalad7:mixinextras-fabric:0.5.0'
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}
shadowJar { configurations = [project.configurations.shadowCommon]; archiveClassifier = 'dev-shadow'; duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
    archiveClassifier = ''
    destinationDirectory = rootProject.file(rootProject.delivery_directory)
}
jar { archiveClassifier = 'dev' }
sourcesJar {
    dependsOn ':common:sourcesJar'
    from project(':common').sourceSets.main.allSource
}

